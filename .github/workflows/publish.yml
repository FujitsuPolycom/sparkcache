name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match project version {expected!r}")
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,release]"
      - run: python -m ruff check .
      - run: python -m pytest sparkcache -q
      - run: python -m pytest deploy -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify isolated wheel installation
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python tools/verify_distribution.py dist/*.whl dist/*.tar.gz --version "$version"
      - name: Record distribution identities
        shell: bash
        run: |
          (
            cd dist
            sha256sum -- *.whl *.tar.gz
          ) | tee release-artifact-sha256.txt
          {
            echo "### Release artifact SHA-256"
            echo '```text'
            cat release-artifact-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifact-identity
          path: release-artifact-sha256.txt
          if-no-files-found: error

  publish:
    name: Publish verified distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sparkcache/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifact-identity
          path: release-artifact-identity/
      - name: Verify qualified distribution identities
        shell: bash
        run: |
          cd dist
          sha256sum --check \
            ../release-artifact-identity/release-artifact-sha256.txt
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
